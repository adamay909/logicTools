

<div id="ndseqcalctemplate">

 <style id="ndSequentCalculus">

 div.derivation.ndseqcalc {
     display:grid;
     width: 100%;
	 counter-reset: linecounter;
     grid-template-columns: 3em minmax(40px, max-content) 3em minmax(40px, max-content) 3em minmax(40px, max-content);
}


div.row.ndseqcalc {
 	 display:grid;
	 grid-column: 1/7;
     grid-template-columns: subgrid;
     width: 100%;
	 height: 1.4em;
}

.row.ndseqcalc::before{
	 counter-increment: linecounter;
	 content: counter(linecounter) ".\2003";
	 color: black;
	 text-align: right;
}

</style>
